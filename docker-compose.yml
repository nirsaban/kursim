version: '3.8'

services:
  postgres:
    # pgvector/pgvector:pg16 = official Postgres 16 + the pgvector extension
    # pre-built. Required for KnowledgeChunk.embedding. NOTE: this image is
    # Debian/glibc, while postgres:16-alpine is musl — on an EXISTING data
    # volume, run `REINDEX DATABASE kursim;` once after the swap (glibc/musl
    # collation ordering can differ and silently break text indexes otherwise).
    # A fresh volume needs no such step.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kursim
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - mediadata:/app/media
    environment:
      DATABASE_URL: postgresql://kursim_app:kursim_app_pw@postgres:5432/kursim
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kursim
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  mediadata:
